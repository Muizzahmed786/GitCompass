# PRODUCTION Docker Compose
# DO NOT use for local development — the server image will be stale.
# For development, run:
#   - Infrastructure: docker compose -f docker-compose.dev.yml up -d
#   - Server: cd server && uvicorn app.main:app --reload --port 8000
#   - Client: cd client && npm run dev
#
services:
  server:
    build: ./server
    container_name: gitcompass-server
    ports:
      - "8000:8000"
    env_file:
      - ./server/.env
    depends_on:
      - redis

  redis:
    image: redis:7-alpine
    container_name: gitcompass-redis
    ports:
      - "6379:6379"
